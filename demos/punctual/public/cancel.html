<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0e0e11" />
  <title>Cancel booking · Punctual</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="./assets/theme.js"></script>
  <link rel="stylesheet" href="./assets/book.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Punctual booking">
      <svg class="brand__mark" width="26" height="26" viewBox="0 -3 128 128" aria-hidden="true">
        <g stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.45"><line x1="4" y1="58" x2="20" y2="58"/><line x1="1" y1="72" x2="19" y2="72"/><line x1="6" y1="86" x2="22" y2="86"/></g>
        <path d="M44 92 C31 92 20 82 20 69 C20 57 29 47 41 46 C45 33 57 24 70 24 C85 24 98 35 100 51 C110 53 118 62 118 72 C118 83 109 92 97 92 Z" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linejoin="round"/>
        <path d="M69 36 L50 71 L63 71 L57 102 L88 60 L72 60 L80 36 Z" fill="currentColor"/>
      </svg>
      <span>Punctual</span>
    </a>
    <div class="topbar__title">
      <h1>Cancel</h1>
      <p>Signed link from your confirmation email</p>
    </div>
  </header>

  <main class="book">
    <article class="confirm" id="panel">
      <p class="eyebrow" id="eyebrow">Booking</p>
      <h2 id="title">Checking this link…</h2>
      <p class="hint" id="when"></p>
      <p class="hint" id="hint" role="status"></p>
      <div class="confirm__row">
        <button class="btn btn-primary" id="cancel" type="button" hidden>Cancel this booking</button>
        <a class="btn" href="./">Back to booking</a>
      </div>
    </article>
  </main>

  <script type="module" src="./assets/cancel.js"></script>
</body>
</html>
